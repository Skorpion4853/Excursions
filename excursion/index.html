<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Виртуальная экскурсия</title>
<link rel="stylesheet" href="lib/pannellum.css">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #pano { position: absolute; inset: 0; }
  .bar { position: absolute; left: 0; right: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  #top { top: 0; background: linear-gradient(#000a, #0000); justify-content: space-between; }
  #title { font-size: 18px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  #counter { font-size: 14px; opacity: .8; }
  .nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 48px; height: 48px; border: 0; border-radius: 50%;
         background: #0008; color: #fff; font-size: 26px; cursor: pointer; }
  .nav:hover { background: #000c; }
  #prev { left: 16px; } #next { right: 16px; }
  #strip { bottom: 0; background: linear-gradient(#0000, #000c); overflow-x: auto; gap: 8px; }
  #strip button { flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; cursor: pointer; color: #fff; width: 130px; text-align: left; }
  #strip button.active { border-color: #4da3ff; }
  #strip img { display: block; width: 100%; height: 56px; object-fit: cover; border-radius: 4px; }
  #strip span { display: block; font-size: 11px; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #links { position: absolute; z-index: 2; left: 50%; bottom: 104px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: calc(100% - 140px); }
  #links button { background: #1e6fd9e6; color: #fff; border: 0; border-radius: 18px; padding: 8px 14px; font-size: 14px; cursor: pointer; box-shadow: 0 2px 6px #0006; }
  #links button:hover { background: #2b82f0; }
  body.hide-strip #links { bottom: 16px; }
  @media (max-width: 600px) { #links { max-width: calc(100% - 32px); gap: 6px; } #links button { padding: 6px 10px; font-size: 13px; } .nav { top: 40%; } }
  #toggle { background: #0008; border: 0; color: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  body.hide-strip #strip { display: none; }
  .pnlm-controls-container { top: 56px; }
  .pnlm-panorama-info { display: none !important; }
</style>
</head>
<body>
<div id="pano"></div>
<div id="top" class="bar">
  <div><div id="title"></div><div id="counter"></div></div>
  <button id="toggle">Скрыть список</button>
</div>
<button id="prev" class="nav" aria-label="Назад">‹</button>
<button id="next" class="nav" aria-label="Далее">›</button>
<div id="links"></div>
<div id="strip" class="bar"></div>

<script src="lib/pannellum.js"></script>
<script src="scenes.js"></script>
<script>
  // Самый широкий обзор, при котором края частичной панорамы не видны на экране
  function fitHfov(s) {
    var el = document.getElementById("pano"), aspect = el.clientWidth / el.clientHeight;
    var r = Math.PI / 180, byHeight = 2 * Math.atan(Math.tan(s.vaov * r / 2) * aspect) / r;
    return Math.max(10, Math.min(byHeight, s.haov, 120) - 1);
  }

  var scenes = {};
  SCENES.forEach(function (s) {
    scenes[s.id] = {
      title: s.title,
      type: "equirectangular",
      panorama: "panorams/" + s.id + ".jpg",
      haov: s.haov, vaov: s.vaov, vOffset: 0,
      hfov: fitHfov(s), minHfov: 10, maxHfov: fitHfov(s)
    };
  });

  var viewer = pannellum.viewer("pano", {
    default: { firstScene: SCENES[0].id, sceneFadeDuration: 600, autoLoad: true, showControls: true, compass: false },
    scenes: scenes
  });

  var strip = document.getElementById("strip");
  SCENES.forEach(function (s, i) {
    var b = document.createElement("button");
    b.innerHTML = '<img loading="lazy" src="thumbs/' + s.id + '.jpg" alt=""><span>' + (i + 1) + ". " + s.title + "</span>";
    b.onclick = function () { go(i); };
    strip.appendChild(b);
  });

  var current = 0;
  function indexOf(id) {
    for (var i = 0; i < SCENES.length; i++) if (SCENES[i].id === id) return i;
  }
  function go(i) {
    i = (i + SCENES.length) % SCENES.length;
    if (i !== current) viewer.loadScene(SCENES[i].id);
    show(i);
  }
  function show(i) {
    current = i;
    document.getElementById("title").textContent = SCENES[i].title;
    document.getElementById("counter").textContent = SCENES[i].floor + " · шаг " + (i + 1) + " из " + SCENES.length;
    var links = document.getElementById("links");
    links.innerHTML = "";
    SCENES[i].links.forEach(function (id) {
      var j = indexOf(id), b = document.createElement("button");
      b.textContent = "→ " + SCENES[j].title;
      b.onclick = function () { go(j); };
      links.appendChild(b);
    });
    Array.prototype.forEach.call(strip.children, function (b, j) { b.classList.toggle("active", j === i); });
    strip.children[i].scrollIntoView({ block: "nearest", inline: "center" });
  }
  function refit() {
    var h = fitHfov(SCENES[current]);
    viewer.setHfovBounds([10, h]);
    if (viewer.getHfov() > h || isNaN(viewer.getHfov())) viewer.setHfov(h, false);
  }
  window.addEventListener("resize", refit);
  viewer.on("load", refit);
  viewer.on("scenechange", function (id) {
    show(indexOf(id));
  });
  document.getElementById("prev").onclick = function () { go(current - 1); };
  document.getElementById("next").onclick = function () { go(current + 1); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "PageDown" || e.key === "n") go(current + 1);
    if (e.key === "PageUp" || e.key === "p") go(current - 1);
  });
  document.getElementById("toggle").onclick = function () {
    var hidden = document.body.classList.toggle("hide-strip");
    this.textContent = hidden ? "Показать список" : "Скрыть список";
  };
  show(0);
</script>
</body>
</html>
