server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript;

    location / {
        try_files $uri $uri/ =404;
    }

    # Панорамы и библиотека не меняются между выпусками, их можно долго кэшировать
    location ~* ^/(panos|thumbs|lib)/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Список сцен меняется при правке маршрута, его браузер должен перепроверять
    location = /scenes.js {
        add_header Cache-Control "no-cache";
    }
}
